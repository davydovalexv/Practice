# Правила именования Data Vault 2.0

# Плоская staging-таблица: несколько бизнес-сущностей в одной строке
# Эталон: config/few_shot_examples.yaml → stg_crm_orders
flat_staging:
  description: |
    Денормализованная таблица (CRM: клиент + заказ в одной строке).
    Строится: hub_customer, hub_order, link_customer_order,
    sat_customer_profile, sat_order_details.
  link_hash_pattern: "MD5(bk1 || ';' || bk2)"

naming:
  hub_prefix: hub_
  satellite_prefix: sat_
  link_prefix: link_
  hash_key_suffix: _hk
  hash_diff_suffix: _hd
  load_date_column: load_date
  record_source_column: record_source

dv_types:
  - hub
  - satellite
  - link

dv_roles:
  business_key: "Бизнес-ключ хаба"
  attribute: "Описательный атрибут сателлита"
  grain_key: "Ключ зернистости (дата, timestamp)"
  link_key: "Ключ связи между хабами"
  operational_key: "Суррогатный PK источника — не грузится в Raw Vault"

hash:
  algorithm: md5
