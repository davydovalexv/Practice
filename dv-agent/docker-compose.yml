services:
  postgres:
    image: postgres:16-alpine
    container_name: dv_postgres
    environment:
      POSTGRES_USER: dv_user
      POSTGRES_PASSWORD: dv_pass
      POSTGRES_DB: source_db
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DV_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dv_user -d source_db"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  stop-host-ollama:
    build: ./docker/stop-host-ollama
    container_name: dv_stop_host_ollama
    privileged: true
    pid: host
    network_mode: host
    restart: "no"

  ollama:
    build: ./docker/ollama
    container_name: dv_ollama
    privileged: true
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${DV_OLLAMA_PORT:-11434}:11434"
    depends_on:
      stop-host-ollama:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    container_name: dv_ollama_init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      DV_OLLAMA_MODEL: ${DV_OLLAMA_MODEL:-qwen2.5-coder:7b}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        echo "==> Ollama: загрузка модели ${DV_OLLAMA_MODEL:-qwen2.5-coder:7b}"
        echo "    (первый раз может занять 10-30 мин, нужен интернет)"
        until ollama list >/dev/null 2>&1; do sleep 2; done
        ollama pull "${DV_OLLAMA_MODEL:-qwen2.5-coder:7b}"
        echo "==> Модель готова"
    restart: "no"

  ui:
    build: .
    container_name: dv_ui
    entrypoint: ["streamlit"]
    command:
      - run
      - src/dv_agent/ui/streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false
      - --server.fileWatcherType=poll
    environment:
      DV_CONFIG_PATH: /app/config/docker.yaml
    volumes:
      - ./output:/app/output
      - ./data/sql:/data/sql:ro
      - ./src:/app/src:ro
      - ./config:/app/config:ro
    ports:
      - "${DV_UI_PORT:-8501}:8501"
    depends_on:
      postgres:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped

  agent:
    build: .
    container_name: dv_agent
    entrypoint: ["dv-agent"]
    environment:
      DV_CONFIG_PATH: /app/config/docker.yaml
    volumes:
      - ./output:/app/output
      - ./data/sql:/data/sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - cli
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  ollama_data:
