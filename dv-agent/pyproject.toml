[project]
name = "dv-agent"
version = "0.1.0"
description = "Локальный AI-агент для проектирования Data Vault 2.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.1",
    "sqlglot>=25.0",
    "httpx>=0.27",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-httpx>=0.30"]
ui = ["streamlit>=1.28", "pandas>=2.0"]

[project.scripts]
dv-agent = "dv_agent.cli:app"
dv-agent-ui = "dv_agent.ui.runner:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
